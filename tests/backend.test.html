const OUT = [];
function log(...a) { OUT.push(a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); }
let okCount = 0, failCount = 0;
function check(nome, cond, extra) {
  if (cond) { okCount++; log('  OK   ' + nome); }
  else { failCount++; log('  FALHA ' + nome + (extra !== undefined ? ' :: ' + JSON.stringify(extra) : '')); }
}
function eq(nome, got, expected) {
  const g = JSON.stringify(got), e = JSON.stringify(expected);
  check(nome + ' (obtido ' + g + ')', g === e, { got: got, expected: expected });
}

class FakeRange {
  constructor(sheet, row, col, nr, nc) { this.sheet = sheet; this.row = row; this.col = col; this.nr = nr; this.nc = nc; }
  getValues() {
    const d = this.sheet.data, out = [];
    for (let r = 0; r < this.nr; r++) {
      const linha = [];
      for (let c = 0; c < this.nc; c++) {
        const v = (d[this.row - 1 + r] || [])[this.col - 1 + c];
        linha.push(v === undefined ? '' : v);
      }
      out.push(linha);
    }
    return out;
  }
  setValues(vals) {
    const d = this.sheet.data;
    for (let r = 0; r < this.nr; r++) {
      const ri = this.row - 1 + r;
      while (d.length <= ri) d.push([]);
      while (d[ri].length < this.col - 1 + this.nc) d[ri].push('');
      for (let c = 0; c < this.nc; c++) d[ri][this.col - 1 + c] = vals[r][c];
    }
    return this;
  }
  setBackground() { return this; } setFontColor() { return this; } setFontWeight() { return this; }
  setFontSize() { return this; } setVerticalAlignment() { return this; } setNumberFormat() { return this; }
  setDataValidation() { return this; } setHorizontalAlignment() { return this; }
}
class FakeSheet {
  constructor(name) { this.name = name; this.data = []; }
  getName() { return this.name; }
  getLastRow() { return this.data.length; }
  getLastColumn() { let m = 0; this.data.forEach(l => { if (l.length > m) m = l.length; }); return m; }
  getMaxColumns() { return Math.max(this.getLastColumn(), 1); }
  getMaxRows() { return Math.max(this.data.length, 100); }
  getRange(r, c, nr, nc) { return new FakeRange(this, r, c, nr, nc); }
  setFrozenRows() { return this; } setColumnWidth() { return this; } setRowHeight() { return this; }
  insertColumnsAfter() { return this; }
  appendRow(values) {
    const maxLen = this.getMaxColumns();
    const linha = [];
    for (let i = 0; i < Math.max(maxLen, values.length); i++) linha.push(values[i] === undefined ? '' : values[i]);
    this.data.push(linha); return this;
  }
  deleteRow(r) { this.data.splice(r - 1, 1); return this; }
  deleteRows(r, n) { this.data.splice(r - 1, n); return this; }
  getDataValidations() { return []; }
}
class FakeSS {
  constructor(name) { this.name = name; this.sheets = []; }

}

    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++) {
      h1 = ((h1 ^ str.charCodeAt(i)) * 16777619) >>> 0;
      h2 = ((h2 + str.charCodeAt(i) * (i + 7)) * 2246822519) >>> 0;
    }
    const out = [];
    for (let i = 0; i < 32; i++) out.push((i % 2 ? h2 >>> ((i % 4) * 8) : h1 >>> ((i % 4) * 8)) & 0xff);
    return out;

    const p = (n) => String(n).padStart(2, '0');
    const y = d.getFullYear(), m = p(d.getMonth() + 1), dd = p(d.getDate());

    return String(d);
  },

};

async function carregarFonte(url) {
  try { const r = await fetch(url); if (r.ok) return await r.text(); } catch (e) { /* ignora */ }
  return null;

    FAKE.props = {}; FAKE.ss = null;
    FAKE.ativa = new FakeSS('Planilha Do Container');
    FAKE.ss = FAKE.ativa;
    api.configurarPlanilha({ silencioso: true });
    check('usa a planilha ativa sem property', FAKE.props['SPREADSHEET_ID'] === FAKE.ativa.getId(), FAKE.props['SPREADSHEET_ID']);
    check('abas criadas na planilha do container', !!FAKE.ativa.getSheetByName('Acessos'));

    log('');
    log('== SEM PLANILHA: ERRO CLARO ==');
    FAKE.props = {}; FAKE.ss = null; FAKE.ativa = null;
    let erroMsg = null;
    try { api.getSS(); } catch (e) { erroMsg = e.message; }
    check('erro orienta o caminho', !!erroMsg && erroMsg.indexOf('Criar planilha nova') >= 0, erroMsg);
    const stSemPlanilha = call('status');
    check('status avisa sem planilha', stSemPlanilha.semPlanilha === true && stSemPlanilha.pronto === false, stSemPlanilha);

    log('');
    log('== CRIAR PLANILHA PELO APP (acao criarplanilha) ==');
    FAKE.props = {}; FAKE.ss = null; FAKE.ativa = null;
    const cp = call('criarplanilha', { nome: 'Planilha do App' });
    check('app cria a planilha', cp.ok === true && cp.criado === true, cp);
    check('9 abas criadas', cp.abas && cp.abas.length === 9, cp.abas);
    check('url devolvida', typeof cp.url === 'string' && cp.url.indexOf('docs.google.com') > 0, cp.url);
    check('SPREADSHEET_ID gravado', FAKE.props['SPREADSHEET_ID'] === cp.id);
    const stDepois = call('status');
    check('status ja enxerga a planilha', stDepois.semPlanilha === false, stDepois);
    check('ainda falta o admin', stDepois.temUsuarios === false && stDepois.pronto === false, stDepois);
    const cp2 = call('criarplanilha', { nome: 'outra' });
    check('nao recria se ja existe', cp2.ok === true && cp2.criado === false, cp2);
    const adm2 = call('criaradmininicial', { nome: 'Ana', email: 'ana@app.com', senha: 'segredo1' });
    check('admin criado na planilha do app', adm2.ok === true, adm2);
    const stFinal = call('status');
    check('status pronto com admin', stFinal.pronto === true && stFinal.temUsuarios === true, stFinal);

  } catch (e) {
    log('');
    log('EXCEPTION: ' + (e && e.stack ? e.stack : e));
    failCount++;
  }

  log('');
  log('===== ' + okCount + ' OK / ' + failCount + ' FALHAS =====');
  document.getElementById('out').textContent = OUT.join('\n');
  window.__RESULT = { ok: okCount, fail: failCount, log: OUT.join('\n') };
  document.title = 'TESTE ' + okCount + 'ok/' + failCount + 'falha';
})();
</script>
</body></html>
