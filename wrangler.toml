name = "app-financeiro"
main = "backend/worker.js"
compatibility_date = "2024-11-01"

# Serve o front-end estatico (pasta site/) direto pelo Cloudflare Worker
[assets]
directory = "./site"
binding = "ASSETS"

# Vinculo permanente do Banco de Dados Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "app-financeiro-db"
database_id = "bd32f080-4483-4bf7-aa15-68db16914647"
